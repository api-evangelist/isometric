openapi: 3.2.0
info:
  description: '# Standards


    ## Versioning


    This API will be safely versioned using root path versioning, in the format `/v{major}`. For example, `/registry/v0/supplier`. ### Compatibility


    We won''t make breaking changes to existing API services or endpoints for API versions higher than `v0`. If breaking changes are necessary, we''ll release a new major version. We may deprecate APIs that have been replaced by a newer version. When doing so, we will expect

    integrated partners to manage a transition to new resources within the deprecation timeline of old ones. We will make the following sort of changes we do not consider to be breaking:


    - Adding new endpoints

    - Adding optional query parameters to API endpoints

    - Adding new properties to existing API responses

    - Reordering properties in existing API responses


    It is important that clients are built to be robust to these changes. ## Pagination


    Our API is based on the Relay pagination spec. Paginated endpoints

    will return a `PaginatedListResource` which contains:


    - `page_info` - Containing information regarding pagination cursors and the total number of entities. - `nodes` - Each node is a paginated entity. - `total_count` - The total size of the list across all pages. ### Pagination Parameters


    Paginated endpoints also accepted a standard set of query parameters:


    - `last` - An integer number of items to retrieve **before** the item represented by the cursor passed in the `before` parameter. Defaults to 10 with a maximum value of 50. - `before` - An opaque cursor representing the first item in the previously requested page to select items ordered before it. Submit the previously requested page''s `start_cursor` here when paginated backwards. - `first` - An integer number of items to retrieve **after** the item represented by the cursor passed in the `after` parameter. Defaults to 10 with a maximum value of 50. - `after` - An opaque cursor representing the last item in the previously requested page to select items ordered after it. Submit the previously requested page''s `end_cursor` here when paginated forwards. For example, querying `/registry/v0/beneficiaries` will return a `PaginatedListResource` of the first page of 10 items:


    ```json

    {

    "page_info": {

    "has_previous_page": false,

    "start_cursor": ...,

    "has_next_page": true,

    "end_cursor": "mpG5kcuoFBYtlH",

    },

    "nodes": [{

    "id": "org_12345iso678",

    "name": "My Org",

    ... }],

    "total_count": 100

    }

    ```


    Then querying `/registry/v0/beneficiaries?first=15&after=mpG5kcuoFBYtlH` will return a `PaginatedListResource` of the next 15 items. ## Dates


    Datetime fields in the APIs conform to the ISO 8601 date and time format in UTC. For example: `2024-01-22T11:56:48.520641Z`. ## Country Codes


    Countries are identified in the APIs via ISO 3166-1 Alpha-3 codes. For example: `GBR` and `USA`. # Authentication


    Most API requests will need to authenticate against the Isometric API in two ways simultaneously:


    - By passing a **client secret** in the `X-Client-Secret` header to identify the system integrating with the API. - By passing an **access token** in the `Authorization` header to authenticate as a specific organization, in order to gain access to its private data. ### Client Authentication


    Every API call to Isometric must include a **client secret** identifying the client application. This client secret is tied to a particular environment - sandbox or production. The client secret should be submitted on every API request via the `X-Client-Secret` header. For example `X-Client-Secret: uPrO...wxAh`. ### Organization Authentication


    In addition, a large number of API requests will require an **access token** in order for the caller to identify themselves and act as a specific Organization. To authenticate as an Organization you will need to submit a JWT bearer access token via the `Authorization` header. For example: `Authorization: Bearer eyJh...sw5c`.'
  title: Isometric Certify Data Ingestion Data Upload Submissions API
  version: v0
servers:
- description: Sandbox Isometric MRV API
  url: https://api.sandbox.isometric.com/mrv/v0
- description: Production Isometric MRV API
  url: https://api.isometric.com/mrv/v0
tags:
- name: Data Upload Submissions
paths:
  /data-upload-submissions:
    get:
      description: List data upload jobs with optional status filtering
      operationId: get_data_upload_submissions_data_upload_submissions_get
      parameters:
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DataUploadSubmissionStatus'
          - type: 'null'
          title: Status
      - in: query
        name: last
        required: false
        schema:
          default: 10
          description: An integer number of items to retrieve before the item represented by the cursor passed in the before parameter. Defaults to 10 with a maximum value of 50.
          exclusiveMinimum: 0
          maximum: 50
          title: Last
          type: integer
      - in: query
        name: before
        required: false
        schema:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          description: An opaque cursor representing the first item in the previously requested page to select items ordered before it. Submit the previously requested page’s start_cursor here when paginated backwards.
          title: Before
      - in: query
        name: first
        required: false
        schema:
          default: 10
          description: An integer number of items to retrieve after the item represented by the cursor passed in the after parameter. Defaults to 10 with a maximum value of 50.
          exclusiveMinimum: 0
          maximum: 50
          title: First
          type: integer
      - in: query
        name: after
        required: false
        schema:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
          description: An opaque cursor representing the last item in the previously requested page to select items ordered after it. Submit the previously requested page’s end_cursor here when paginated forwards.
          title: After
      - description: A secret token identifying the client connecting to the API
        in: header
        name: x-client-secret
        required: true
        schema:
          description: A secret token identifying the client connecting to the API
          examples:
          - Syou3EZiO5vuMEgNyBeA8cjEMYOnQDwP
          title: Client secret
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListResource_DataUploadSubmission_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Data Upload Submissions
      tags:
      - Data Upload Submissions
    post:
      operationId: post_data_upload_submission_data_upload_submissions_post
      parameters:
      - description: A secret token identifying the client connecting to the API
        in: header
        name: x-client-secret
        required: true
        schema:
          description: A secret token identifying the client connecting to the API
          examples:
          - Syou3EZiO5vuMEgNyBeA8cjEMYOnQDwP
          title: Client secret
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataUploadSubmissionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadSubmission'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Post Data Upload Submission
      tags:
      - Data Upload Submissions
  /data-upload-submissions/{id}:
    get:
      description: Get a specific data upload job by ID
      operationId: get_data_upload_submission_data_upload_submissions__id__get
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/IsometricIDPathParam_DataUploadSubmission_'
      - description: A secret token identifying the client connecting to the API
        in: header
        name: x-client-secret
        required: true
        schema:
          description: A secret token identifying the client connecting to the API
          examples:
          - Syou3EZiO5vuMEgNyBeA8cjEMYOnQDwP
          title: Client secret
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadSubmission'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Data Upload Submission
      tags:
      - Data Upload Submissions
components:
  schemas:
    DataUploadSubmissionType:
      enum:
      - biochar_pyrolysis_reactor_facility_time_series
      - dac_storage_site_time_series
      - dac_facility_time_series
      - wae_wastewater_treatment_plant_facility_time_series
      title: DataUploadSubmissionType
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    DataUploadSubmission:
      properties:
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          description: Error message if the submission failed during processing.
          title: Error Message
        facility_id:
          anyOf:
          - example: fcl_1G8QT5ZAB1S0XSDW
            examples:
            - fcl_1G8QT5ZAB1S0XSDW
            - fcl_1E384BDCGSBXNNZZ
            maxLength: 37
            minLength: 20
            type: string
          - type: 'null'
          title: Facility Id
        id:
          example: dus_1GBBSJ6P91S0R41N
          examples:
          - dus_1GBBSJ6P91S0R41N
          - dus_1CRY1X1Q3SBX1CY2
          maxLength: 37
          minLength: 20
          title: Id
          type: string
        status:
          $ref: '#/components/schemas/DataUploadSubmissionStatus'
        storage_location_id:
          anyOf:
          - example: slc_1F3PMGVC91S0SBK3
            examples:
            - slc_1F3PMGVC91S0SBK3
            - slc_1DCY5K78BSBX3XMZ
            maxLength: 37
            minLength: 20
            type: string
          - type: 'null'
          title: Storage Location Id
        submission_type:
          $ref: '#/components/schemas/DataUploadSubmissionType'
      required:
      - id
      - submission_type
      - status
      - storage_location_id
      - facility_id
      title: DataUploadSubmission
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    IsometricIDPathParam_DataUploadSubmission_:
      $ref: '#/components/schemas/IsometricIDRequestParam_DataUploadSubmission_'
    PaginatedListResource_DataUploadSubmission_:
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/DataUploadSubmission'
          title: Nodes
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
        total_count:
          title: Total Count
          type: integer
      required:
      - nodes
      - total_count
      - page_info
      title: PaginatedListResource[DataUploadSubmission]
      type: object
    CreateDataUploadSubmissionRequest:
      properties:
        facility_id:
          anyOf:
          - example: fcl_1G8QT5ZAB1S0XSDW
            examples:
            - fcl_1G8QT5ZAB1S0XSDW
            - fcl_1E384BDCGSBXNNZZ
            maxLength: 37
            minLength: 20
            type: string
          - type: 'null'
          description: The ID of the facility the data is associated with.
          title: Facility Id
        file_upload_id:
          description: The ID of the file upload that contains the data to be processed.
          example: tfu_1DZPAW31R1S0ZESH
          examples:
          - tfu_1DZPAW31R1S0ZESH
          - tfu_1CHF4YC38SBX9E20
          maxLength: 37
          minLength: 20
          title: File Upload Id
          type: string
        storage_location_id:
          anyOf:
          - example: slc_1F3PMGVC91S0SBK3
            examples:
            - slc_1F3PMGVC91S0SBK3
            - slc_1DCY5K78BSBX3XMZ
            maxLength: 37
            minLength: 20
            type: string
          - type: 'null'
          description: The ID of the storage location the data is associated with.
          title: Storage Location Id
        submission_type:
          $ref: '#/components/schemas/DataUploadSubmissionType'
      required:
      - submission_type
      - file_upload_id
      title: CreateDataUploadSubmissionRequest
      type: object
    PageInfo:
      properties:
        end_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: End Cursor
        has_next_page:
          title: Has Next Page
          type: boolean
        has_previous_page:
          title: Has Previous Page
          type: boolean
        start_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Cursor
      required:
      - has_previous_page
      - start_cursor
      - has_next_page
      - end_cursor
      title: PageInfo
      type: object
    DataUploadSubmissionStatus:
      enum:
      - pending
      - completed
      - failed
      title: DataUploadSubmissionStatus
      type: string
    IsometricIDRequestParam_DataUploadSubmission_:
      example: dus_1GBBSJ6P91S0R41N
      examples:
      - dus_1GBBSJ6P91S0R41N
      - dus_1CRY1X1Q3SBX1CY2
      maxLength: 37
      minLength: 20
      type: string
  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: 'A JWT Bearer token header for authentication and authorization, in the format `Authorization: Bearer <token>`'
      scheme: bearer
      type: http
