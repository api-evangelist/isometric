apis:
- aid: isometric:isometric-mcp-server
  name: Isometric MCP Server
  description: >-
    Isometric ships a hosted Model Context Protocol (MCP) server that makes the Isometric Standard, proprietary
    protocols (biochar, DAC, enhanced weathering, marine CDR, biosphere, superpollutants), protocol modules,
    Certify and Registry user guides, and the full API documentation queryable by MCP-compatible AI clients.
    Pre-approved clients include Claude (Claude.ai and Claude Desktop), ChatGPT Developer mode, Google
    Gemini, VS Code with Copilot, Cursor, Windsurf, and Block Goose. Other clients may connect provided
    they support Streamable HTTP transport, OAuth Authorization, and one of two registration mechanisms
    (Client ID Metadata Documents preferred, or preregistration). Sandbox and production endpoints are
    exposed under api.sandbox.isometric.com/mcp and api.isometric.com/mcp.
  humanURL: https://docs.isometric.com/user-guides/ai/mcp-server
  baseURL: https://api.isometric.com/mcp
